<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro'Bronze — Criar Minha Conta</title>
<link rel="stylesheet" href="css/theme.css?v=20260727i">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 1.5rem;
  }
  .card {
    width: 100%; max-width: 420px; background: rgba(36,28,22,.72); backdrop-filter: blur(18px);
    border: 1.5px solid var(--card-border); border-radius: 20px; padding: 2.1rem 1.9rem;
  }
  h1 { font-size: 1.35rem; margin: 0 0 .3rem; color: var(--accent-light); text-align: center; }
  p.sub { color: var(--muted); font-size: .85rem; margin: 0 0 1.5rem; text-align: center; }
  .input-group { margin-bottom: 1rem; text-align: left; }
  .input-group label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: .35rem; font-weight: 600; }
  .input-group input, .input-group select {
    width: 100%; background: var(--card-inp-bg); border: 1.5px solid var(--card-inp-border); border-radius: 10px;
    padding: .7rem .9rem; color: var(--text); font-size: .9rem; font-family: var(--font); outline: none;
  }
  .btn-primario {
    width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: var(--card-btn-text);
    border: none; border-radius: 10px; padding: .85rem; font-size: .9rem; font-weight: 800; cursor: pointer; margin-top: .4rem;
  }
  .btn-primario:disabled { opacity: .5; cursor: not-allowed; }
  #erro { color: var(--red); font-size: .8rem; margin-top: .75rem; min-height: 1em; text-align: center; }
  .erro-link { text-align: center; color: var(--muted); font-size: .85rem; padding: 2rem 0; }
</style>
</head>
<body>

<div class="card" id="tela-form">
  <h1><span class="marca-pro">Pro</span><span class="marca-apo">'</span>Bronze</h1>
  <p class="sub">Crie sua conta para acompanhar suas sessões</p>

  <div class="input-group"><label>Nome</label><input type="text" id="c-nome"></div>
  <div class="input-group"><label>WhatsApp</label><input type="text" id="c-wpp" placeholder="21999999999"></div>
  <div class="input-group">
    <label>Tipo de pele (Fitzpatrick) — opcional</label>
    <select id="c-fitzpatrick">
      <option value="">Prefiro informar na loja</option>
      <option value="I">I — muito clara, sempre queima</option>
      <option value="II">II — clara</option>
      <option value="III">III — morena clara</option>
      <option value="IV">IV — morena moderada</option>
      <option value="V">V — morena escura</option>
      <option value="VI">VI — negra</option>
    </select>
  </div>
  <div class="input-group"><label>E-mail</label><input type="email" id="c-email"></div>
  <div class="input-group"><label>Senha</label><input type="password" id="c-senha"></div>

  <button class="btn-primario" id="btn-criar-conta">Criar minha conta</button>
  <div id="erro"></div>
</div>

<div class="card" id="tela-sem-negocio" style="display:none">
  <div class="erro-link">Link inválido — peça à recepção o link correto de cadastro.</div>
</div>

<script type="module">
import { cadastrarClienteComLogin } from './js/cliente-auth.js?v=20260727i';

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(window.location.search);
const negocioId = params.get('negocio');

if (!negocioId) {
  $('tela-form').style.display = 'none';
  $('tela-sem-negocio').style.display = 'block';
} else {
  $('btn-criar-conta').addEventListener('click', async () => {
    const nome = $('c-nome').value.trim();
    const whatsapp = $('c-wpp').value.trim();
    const tipoFitzpatrick = $('c-fitzpatrick').value || null;
    const email = $('c-email').value.trim();
    const senha = $('c-senha').value;
    $('erro').textContent = '';

    if (!nome || !email || !senha) {
      $('erro').textContent = 'Preencha nome, e-mail e senha.';
      return;
    }
    if (senha.length < 6) {
      $('erro').textContent = 'A senha precisa ter pelo menos 6 caracteres.';
      return;
    }

    $('btn-criar-conta').disabled = true;
    try {
      await cadastrarClienteComLogin(negocioId, { nome, whatsapp, email, senha, tipoFitzpatrick });
      window.location.href = 'cliente.html';
    } catch (err) {
      $('btn-criar-conta').disabled = false;
      if (err.code === 'auth/email-already-in-use') {
        $('erro').textContent = 'Este e-mail já tem uma conta — faça login na área da cliente.';
      } else {
        $('erro').textContent = 'Não foi possível criar a conta. Tente novamente.';
      }
    }
  });
}
</script>
</body>
</html>
