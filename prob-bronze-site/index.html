<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro'Bronze — Comece Grátis</title>
<link rel="stylesheet" href="css/theme.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    background: radial-gradient(circle at 20% 20%, rgba(var(--accent-rgb),.20), transparent 55%), var(--bg);
  }
  .card {
    width: 100%; max-width: 440px; background: rgba(36,28,22,.72); backdrop-filter: blur(18px);
    border: 1.5px solid var(--card-border); border-radius: 20px; padding: 2.2rem 1.9rem;
  }
  h1 { font-size: 1.6rem; margin: 0 0 .2rem; color: var(--accent-light); text-align: center; }
  p.sub { color: var(--muted); font-size: .85rem; margin: 0 0 .4rem; text-align: center; }
  .trial-badge {
    display: block; text-align: center; font-size: .75rem; font-weight: 700; color: var(--accent-light);
    background: rgba(var(--accent-rgb),.12); border: 1px solid rgba(var(--accent-rgb),.3);
    border-radius: 20px; padding: .3rem .8rem; margin: .8rem auto 1.5rem; width: fit-content;
  }
  .input-group { margin-bottom: 1rem; text-align: left; }
  .input-group label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: .35rem; font-weight: 600; }
  .input-group input {
    width: 100%; background: var(--card-inp-bg); border: 1.5px solid var(--card-inp-border); border-radius: 10px;
    padding: .7rem .9rem; color: var(--text); font-size: .9rem; font-family: var(--font); outline: none;
  }
  .btn-primario {
    width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: var(--card-btn-text);
    border: none; border-radius: 10px; padding: .85rem; font-size: .92rem; font-weight: 800; cursor: pointer; margin-top: .4rem;
  }
  .btn-primario:disabled { opacity: .5; cursor: not-allowed; }
  #erro { color: var(--red); font-size: .8rem; margin-top: .75rem; min-height: 1em; text-align: center; }
  .rodape { text-align: center; font-size: .75rem; color: var(--muted); margin-top: 1.2rem; }
  .rodape a { color: var(--accent-light); text-decoration: none; }
</style>
</head>
<body>

<div class="card">
  <h1>Pro'Bronze</h1>
  <p class="sub">Gestão completa para o seu espaço de bronzeamento</p>
  <span class="trial-badge">✨ 7 dias grátis, sem cartão</span>

  <div class="input-group"><label>Nome do negócio</label><input type="text" id="f-negocio" placeholder="Ex: Studio Bronze Rio"></div>
  <div class="input-group"><label>Seu nome</label><input type="text" id="f-nome"></div>
  <div class="input-group"><label>E-mail</label><input type="email" id="f-email"></div>
  <div class="input-group"><label>Senha</label><input type="password" id="f-senha"></div>

  <button class="btn-primario" id="btn-cadastrar">Começar meu trial grátis</button>
  <div id="erro"></div>

  <div class="rodape">Já tem conta? <a href="esteticista.html">Entrar</a></div>
</div>

<script type="module">
import { cadastrarNegocioComDono } from './js/auth.js';

const $ = (id) => document.getElementById(id);

$('btn-cadastrar').addEventListener('click', async () => {
  const nomeNegocio = $('f-negocio').value.trim();
  const nomeDono = $('f-nome').value.trim();
  const email = $('f-email').value.trim();
  const senha = $('f-senha').value;
  $('erro').textContent = '';

  if (!nomeNegocio || !nomeDono || !email || !senha) {
    $('erro').textContent = 'Preencha todos os campos.';
    return;
  }
  if (senha.length < 6) {
    $('erro').textContent = 'A senha precisa ter pelo menos 6 caracteres.';
    return;
  }

  $('btn-cadastrar').disabled = true;
  try {
    await cadastrarNegocioComDono({ nomeNegocio, email, senha, nomeDono });
    window.location.href = 'esteticista.html';
  } catch (err) {
    $('btn-cadastrar').disabled = false;
    if (err.code === 'auth/email-already-in-use') {
      $('erro').textContent = 'Este e-mail já tem uma conta — faça login.';
    } else {
      $('erro').textContent = 'Não foi possível criar sua conta. Tente novamente.';
    }
  }
});
</script>
</body>
</html>
