<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro'Bronze — Área da Cliente</title>
<link rel="stylesheet" href="css/theme.css?v=20260726q">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }
  main { max-width: 480px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

  #tela-login {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    background: radial-gradient(circle at 20% 20%, rgba(var(--accent-rgb),.20), transparent 55%), var(--bg);
  }
  .login-card {
    width: 100%; max-width: 380px; background: rgba(36,28,22,.72); backdrop-filter: blur(18px);
    border: 1.5px solid var(--card-border); border-radius: 20px; padding: 2.3rem 1.9rem; text-align: center;
  }
  .login-card h1 { font-size: 1.4rem; margin: 0 0 .3rem; color: var(--accent-light); }
  .login-card p { color: var(--muted); font-size: .85rem; margin: 0 0 1.5rem; }
  .input-group { margin-bottom: 1rem; text-align: left; }
  .input-group label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: .35rem; font-weight: 600; }
  .input-group input {
    width: 100%; background: var(--card-inp-bg); border: 1.5px solid var(--card-inp-border); border-radius: 10px;
    padding: .7rem .9rem; color: var(--text); font-size: .9rem; font-family: var(--font); outline: none;
  }
  .btn-primario {
    width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: var(--card-btn-text);
    border: none; border-radius: 10px; padding: .8rem; font-size: .9rem; font-weight: 800; cursor: pointer;
  }
  #login-erro { color: var(--red); font-size: .8rem; margin-top: .75rem; min-height: 1em; }

  #painel-cliente { display: none; }
  header.topo-cliente { text-align: center; padding: 1.5rem 0 1rem; }
  header.topo-cliente h1 { color: var(--accent-light); font-size: 1.4rem; margin: 0 0 .3rem; }
  header.topo-cliente p { color: var(--muted); font-size: .85rem; margin: 0; }

  .card { background: var(--card); border: 1.5px solid var(--card-border); border-radius: 14px; padding: 1.1rem; margin-bottom: .8rem; }
  .card-titulo { font-weight: 800; font-size: .95rem; margin-bottom: .6rem; color: var(--accent-light); }

  .pacote-progresso { height: 8px; background: rgba(245,230,211,.08); border-radius: 4px; overflow: hidden; margin-top: .5rem; }
  .pacote-progresso-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-light)); }

  .item { display: flex; justify-content: space-between; align-items: center; padding: .7rem 0; border-bottom: 1px solid var(--card-border); font-size: .85rem; }
  .item:last-child { border-bottom: none; }
  .item .nome { font-weight: 700; }
  .item .detalhe { color: var(--muted); font-size: .75rem; margin-top: .15rem; }

  .empty-state { text-align: center; color: var(--muted); padding: 1.5rem 1rem; font-size: .85rem; }
  .btn-secundario { width: 100%; background: transparent; border: 1.5px solid var(--card-border); color: var(--muted); border-radius: 8px; padding: .6rem; font-size: .8rem; cursor: pointer; margin-top: .5rem; }
</style>
</head>
<body>

<div id="tela-login">
  <div class="login-card">
    <h1><span class="marca-pro">Pro</span><span class="marca-apo">'</span>Bronze</h1>
    <p>Área da Cliente</p>
    <div class="input-group"><label>E-mail</label><input type="email" id="login-email" autocomplete="username"></div>
    <div class="input-group"><label>Senha</label><input type="password" id="login-senha" autocomplete="current-password"></div>
    <button class="btn-primario" id="btn-login">Entrar</button>
    <div id="login-erro"></div>
  </div>
</div>

<div id="painel-cliente">
  <main>
    <header class="topo-cliente">
      <h1 id="vitrine-titulo">Pro'Bronze</h1>
      <p id="vitrine-subtitulo">Olá! Acompanhe suas sessões por aqui.</p>
      <div id="contato-estabelecimento" style="margin-top:.4rem"></div>
    </header>

    <div class="card">
      <div class="card-titulo">Agendar Nova Sessão</div>
      <div id="agendar-avisos"></div>
      <div class="input-group">
        <label>Serviços (selecione um ou mais)</label>
        <div id="agendar-servicos" class="empty-state">Carregando...</div>
      </div>
      <div class="input-group"><label>Data e hora</label><input type="datetime-local" id="agendar-datahora"></div>
      <button class="btn-primario" id="btn-agendar-online">Confirmar Agendamento</button>
    </div>

    <div class="card">
      <div class="card-titulo">Meus Pacotes</div>
      <div id="lista-meus-pacotes"><div class="empty-state">Carregando...</div></div>
    </div>

    <div class="card">
      <div class="card-titulo">Próximas Sessões</div>
      <div id="lista-proximas"><div class="empty-state">Carregando...</div></div>
    </div>

    <div class="card">
      <div class="card-titulo">Histórico</div>
      <div id="lista-historico"><div class="empty-state">Carregando...</div></div>
    </div>

    <button class="btn-secundario" id="btn-sair-cliente">Sair</button>
  </main>
</div>

<script type="module">
import { onAuthChange, login, logout } from './js/auth.js?v=20260726q';
import { db } from './js/firebase-config.js?v=20260726q';
import {
  collection, query, where, onSnapshot
} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
import { escutarServicos, calcularCombo } from './js/servicos.js?v=20260726q';
import { criarAgendamento, contarConflitosHorario } from './js/agenda.js?v=20260726q';
import { checarElegibilidade } from './js/agenda.js?v=20260726q';
import { escutarCabines } from './js/cabines.js?v=20260726q';
import { escutarConfigNegocio } from './js/config-negocio.js?v=20260726q';
import { toast } from './js/ui-feedback.js?v=20260726q';

window.addEventListener('unhandledrejection', (e) => {
  console.error(e.reason);
  const detalhe = e.reason?.code || e.reason?.message || '';
  toast(`Algo deu errado. Tente novamente.${detalhe ? ' [' + detalhe + ']' : ''}`, 'erro');
});
window.addEventListener('firestore-erro', (e) => {
  const err = e.detail;
  const detalhe = err?.code || err?.message || 'erro desconhecido';
  toast(`Não foi possível carregar alguns dados. [${detalhe}]`, 'erro');
});

const $ = (id) => document.getElementById(id);
let servicosCache = [];
let combosSelecionados = new Set();
let clienteAtual = null;
let cabinesCache = [];
let configNegocioCache = { nome: "Pro'Bronze", whatsappNegocio: '', chavePix: '', vitrineSubtitulo: '', intervaloMinimoHoras: 24, limiteSessoesMes: 12 };

// Login da cliente usa a mesma Auth do Firebase; o vínculo com o
// documento em "clientes" é feito por clienteUid (campo salvo no
// cadastro público, não no auth.js da equipe — ver nota abaixo).

$('btn-login').addEventListener('click', async () => {
  const email = $('login-email').value.trim();
  const senha = $('login-senha').value;
  $('login-erro').textContent = '';
  if (!email || !senha) { $('login-erro').textContent = 'Preencha e-mail e senha.'; return; }
  try {
    const { getAuth, signInWithEmailAndPassword } = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js');
    const auth = getAuth();
    await signInWithEmailAndPassword(auth, email, senha);
  } catch (err) {
    $('login-erro').textContent = 'E-mail ou senha incorretos.';
  }
});
$('login-senha').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btn-login').click(); });

$('btn-sair-cliente').addEventListener('click', async () => {
  const { getAuth, signOut } = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js');
  await signOut(getAuth());
});

(async () => {
  const { getAuth, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js');
  const auth = getAuth();
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      $('tela-login').style.display = 'flex';
      $('painel-cliente').style.display = 'none';
      return;
    }
    // Busca o doc do cliente vinculado a este login (campo clienteUid)
    const q = query(collection(db, 'clientes'), where('clienteUid', '==', user.uid));
    const unsub = onSnapshot(q, (snap) => {
      if (snap.empty) {
        $('login-erro').textContent = 'Esta conta ainda não está vinculada a um cadastro de cliente.';
        return;
      }
      const clienteDoc = snap.docs[0];
      const cliente = { id: clienteDoc.id, ...clienteDoc.data() };
      clienteAtual = cliente;
      $('tela-login').style.display = 'none';
      $('painel-cliente').style.display = 'block';
      escutarMeusPacotes(cliente.id);
      escutarMinhasSessoes(cliente.negocioId, cliente.id);
      escutarServicos(cliente.negocioId, (servicos) => {
        servicosCache = servicos;
        renderServicosAgendar(servicos);
      });
      escutarCabines(cliente.negocioId, (cabines) => { cabinesCache = cabines; });
      escutarConfigNegocio(cliente.negocioId, (config) => {
        configNegocioCache = config;
        $('vitrine-titulo').textContent = config.nome;
        $('vitrine-subtitulo').textContent = config.vitrineSubtitulo;
        renderContatoEstabelecimento(config);
      });
    });
  });
})();

function renderContatoEstabelecimento(config) {
  const wrap = $('contato-estabelecimento');
  if (!wrap) return;
  const linhas = [];
  if (config.whatsappNegocio) linhas.push(`<div class="detalhe">📱 WhatsApp: ${config.whatsappNegocio}</div>`);
  if (config.chavePix) linhas.push(`<div class="detalhe">💳 PIX: ${config.chavePix}</div>`);
  wrap.innerHTML = linhas.join('');
}

function escutarMeusPacotes(clienteId) {
  const q = query(collection(db, 'pacotesSessoes'), where('clienteId', '==', clienteId), where('status', '==', 'ativo'));
  onSnapshot(q, (snap) => {
    const wrap = $('lista-meus-pacotes');
    if (snap.empty) { wrap.innerHTML = '<div class="empty-state">Nenhum pacote ativo.</div>'; return; }
    wrap.innerHTML = snap.docs.map((d) => {
      const p = d.data();
      const pct = Math.round((p.sessoesUsadas / p.totalSessoes) * 100);
      return `
        <div class="item" style="display:block">
          <div class="nome">${p.sessoesUsadas}/${p.totalSessoes} sessões usadas</div>
          <div class="pacote-progresso"><div class="pacote-progresso-fill" style="width:${pct}%"></div></div>
        </div>
      `;
    }).join('');
  });
}

function escutarMinhasSessoes(negocioId, clienteId) {
  const q = query(
    collection(db, 'agendamentos'),
    where('negocioId', '==', negocioId),
    where('clienteId', '==', clienteId)
  );
  onSnapshot(q, (snap) => {
    const proximas = [];
    const historico = [];
    snap.forEach((d) => {
      const ag = { id: d.id, ...d.data() };
      if (ag.status === 'agendado') proximas.push(ag);
      else historico.push(ag);
    });
    proximas.sort((a, b) => a.dataHora.toMillis() - b.dataHora.toMillis());
    historico.sort((a, b) => b.dataHora.toMillis() - a.dataHora.toMillis());
    renderLista('lista-proximas', proximas, true);
    renderLista('lista-historico', historico.slice(0, 10), false);
  });
}

function renderLista(elId, lista, futura) {
  const wrap = $(elId);
  if (lista.length === 0) {
    wrap.innerHTML = `<div class="empty-state">${futura ? 'Nenhuma sessão agendada.' : 'Nenhum histórico ainda.'}</div>`;
    return;
  }
  wrap.innerHTML = lista.map((ag) => {
    const data = ag.dataHora?.toDate ? ag.dataHora.toDate().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '';
    const servicos = (ag.servicos || []).map((s) => s.nome).join(' + ');
    return `
      <div class="item">
        <div>
          <div class="nome">${data}</div>
          <div class="detalhe">${servicos || 'sem serviço definido'}</div>
        </div>
      </div>
    `;
  }).join('');
}

// ── Agendamento online ───────────────────────────────────
function renderServicosAgendar(servicos) {
  const wrap = $('agendar-servicos');
  if (servicos.length === 0) { wrap.innerHTML = '<div class="empty-state">Nenhum serviço disponível no momento.</div>'; return; }
  wrap.innerHTML = servicos.map((s) => `
    <label style="display:flex;align-items:center;gap:.5rem;padding:.5rem 0;font-size:.85rem">
      <input type="checkbox" data-combo="${s.id}"> ${s.nome} — R$${Number(s.preco).toFixed(2)} (${s.duracaoMin}min)
    </label>
  `).join('');
  wrap.querySelectorAll('[data-combo]').forEach((chk) => {
    chk.addEventListener('change', () => {
      if (chk.checked) combosSelecionados.add(chk.dataset.combo);
      else combosSelecionados.delete(chk.dataset.combo);
    });
  });
}

$('btn-agendar-online').addEventListener('click', async () => {
  const avisosWrap = $('agendar-avisos');
  avisosWrap.innerHTML = '';
  const dataHora = $('agendar-datahora').value;

  if (combosSelecionados.size === 0 || !dataHora) {
    avisosWrap.innerHTML = '<div class="empty-state">Selecione ao menos um serviço e a data/hora.</div>';
    return;
  }

  const elegibilidade = await checarElegibilidade(clienteAtual.id, { intervaloHoras: configNegocioCache.intervaloMinimoHoras, limiteMes: configNegocioCache.limiteSessoesMes });
  if (!elegibilidade.podeAgendar) {
    avisosWrap.innerHTML = elegibilidade.avisos.map((a) => `<div class="empty-state" style="color:var(--red)">${a}</div>`).join('');
    return;
  }

  const servicosDoCombo = servicosCache.filter((s) => combosSelecionados.has(s.id));
  const { duracaoTotalMin } = calcularCombo(servicosDoCombo);
  const tempoMin = duracaoTotalMin || 15;

  const conflitos = await contarConflitosHorario(clienteAtual.negocioId, dataHora, tempoMin);
  if (conflitos >= cabinesCache.length) {
    avisosWrap.innerHTML = `<div class="empty-state" style="color:var(--red)">Todas as cabines já estão ocupadas nesse horário. Escolha outro horário.</div>`;
    return;
  }

  await criarAgendamento(clienteAtual.negocioId, {
    clienteId: clienteAtual.id,
    clienteNome: clienteAtual.nome,
    cabineId: null,
    servicos: servicosDoCombo,
    dataHora,
    origem: 'online',
    tempoMin
  });

  combosSelecionados.clear();
  $('agendar-datahora').value = '';
  document.querySelectorAll('#agendar-servicos [data-combo]').forEach((chk) => { chk.checked = false; });
  toast('Agendamento solicitado! A loja vai confirmar.', 'sucesso');
});
</script>
</body>
</html>
