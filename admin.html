<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro'Bronze — Admin</title>
<link rel="stylesheet" href="css/theme.css?v=20260726e">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }

  #tela-login {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    background: radial-gradient(circle at 20% 20%, rgba(var(--accent-rgb),.20), transparent 55%), var(--bg);
  }
  .login-card {
    width: 100%; max-width: 380px; background: rgba(36,28,22,.72); backdrop-filter: blur(18px);
    border: 1.5px solid var(--card-border); border-radius: 20px; padding: 2.3rem 1.9rem; text-align: center;
  }
  .login-card h1 { font-size: 1.4rem; margin: 0 0 .3rem; color: var(--accent-light); }
  .login-card p { color: var(--muted); font-size: .85rem; margin: 0 0 1.5rem; }
  .input-group { margin-bottom: 1rem; text-align: left; }
  .input-group label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: .35rem; font-weight: 600; }
  .input-group input {
    width: 100%; background: var(--card-inp-bg); border: 1.5px solid var(--card-inp-border); border-radius: 10px;
    padding: .7rem .9rem; color: var(--text); font-size: .9rem; font-family: var(--font); outline: none;
  }
  .btn-primario {
    width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: var(--card-btn-text);
    border: none; border-radius: 10px; padding: .8rem; font-size: .9rem; font-weight: 800; cursor: pointer;
  }
  #login-erro { color: var(--red); font-size: .8rem; margin-top: .75rem; min-height: 1em; }

  #painel { display: none; min-height: 100vh; }
  header.topo {
    display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem;
    border-bottom: 1.5px solid var(--card-border); position: sticky; top: 0; background: var(--bg); z-index: 10;
  }
  header.topo .marca { font-weight: 800; font-size: 1.1rem; color: var(--accent-light); }
  #btn-sair { background: transparent; border: 1.5px solid var(--card-border); color: var(--muted); border-radius: 8px; padding: .5rem .9rem; font-size: .78rem; cursor: pointer; }

  main { padding: 1.25rem; max-width: 900px; margin: 0 auto; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: .7rem; margin-bottom: 1.5rem; }
  .kpi { background: var(--card); border: 1.5px solid var(--card-border); border-radius: 12px; padding: .9rem; text-align: center; }
  .kpi-val { font-size: 1.4rem; font-weight: 800; }
  .kpi-lbl { font-size: .68rem; color: var(--muted); margin-top: .25rem; }
  .kpi.green .kpi-val { color: var(--green); }
  .kpi.yellow .kpi-val { color: var(--yellow); }
  .kpi.red .kpi-val { color: var(--red); }

  .negocio-card { background: var(--card); border: 1.5px solid var(--card-border); border-radius: 12px; padding: 1rem; margin-bottom: .75rem; }
  .negocio-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: .8rem; flex-wrap: wrap; }
  .negocio-nome { font-weight: 800; font-size: .95rem; }
  .negocio-detalhe { font-size: .74rem; color: var(--muted); margin-top: .2rem; }
  .badge { font-size: .68rem; font-weight: 700; padding: .25rem .6rem; border-radius: 20px; white-space: nowrap; }
  .badge.trial { background: rgba(217,164,65,.15); color: var(--yellow); }
  .badge.ativo { background: rgba(123,160,91,.15); color: var(--green); }
  .badge.expirado { background: rgba(193,85,74,.15); color: var(--red); }
  .negocio-acoes { display: flex; gap: .5rem; margin-top: .8rem; flex-wrap: wrap; }
  .negocio-acoes button { flex: 1; min-width: 140px; padding: .5rem; border-radius: 8px; font-size: .76rem; font-weight: 700; cursor: pointer; }
  .btn-ativar { background: rgba(123,160,91,.1); border: 1.5px solid var(--green); color: var(--green); }
  .btn-expirar { background: rgba(193,85,74,.1); border: 1.5px solid var(--red); color: var(--red); }
  .btn-estender { background: rgba(var(--accent-rgb),.1); border: 1.5px solid var(--accent); color: var(--accent-light); }

  .empty-state { text-align: center; color: var(--muted); padding: 3rem 1rem; }
</style>
</head>
<body>

<div id="tela-login">
  <div class="login-card">
    <h1><span class="marca-pro">Pro</span><span class="marca-apo">'</span>Bronze — Admin</h1>
    <p>Acesso restrito ao administrador do sistema</p>
    <div class="input-group"><label>E-mail</label><input type="email" id="login-email" autocomplete="username"></div>
    <div class="input-group"><label>Senha</label><input type="password" id="login-senha" autocomplete="current-password"></div>
    <button class="btn-primario" id="btn-login">Entrar</button>
    <div id="login-erro"></div>
  </div>
</div>

<div id="painel">
  <header class="topo">
    <div class="marca"><span class="marca-pro">Pro</span><span class="marca-apo">'</span>Bronze — Admin</div>
    <button id="btn-sair">Sair</button>
  </header>
  <main>
    <div class="kpis">
      <div class="kpi green"><div class="kpi-val" id="k-ativos">0</div><div class="kpi-lbl">Ativos</div></div>
      <div class="kpi yellow"><div class="kpi-val" id="k-trial">0</div><div class="kpi-lbl">Em trial</div></div>
      <div class="kpi yellow"><div class="kpi-val" id="k-vencendo">0</div><div class="kpi-lbl">Vence em 3d</div></div>
      <div class="kpi red"><div class="kpi-val" id="k-expirados">0</div><div class="kpi-lbl">Expirados</div></div>
    </div>
    <div id="lista-negocios"></div>
  </main>
</div>

<script type="module">
import { auth, db } from './js/firebase-config.js?v=20260726e';
import { ADMIN_UID } from './js/admin-config.js?v=20260726e';
import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
import { collection, onSnapshot, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
import { toast, confirmar } from './js/ui-feedback.js?v=20260726e';

window.addEventListener('unhandledrejection', (e) => {
  console.error(e.reason);
  const detalhe = e.reason?.code || e.reason?.message || '';
  toast(`Algo deu errado. Tente novamente.${detalhe ? ' [' + detalhe + ']' : ''}`, 'erro');
});

const $ = (id) => document.getElementById(id);

$('btn-login').addEventListener('click', async () => {
  const email = $('login-email').value.trim();
  const senha = $('login-senha').value;
  $('login-erro').textContent = '';
  if (!email || !senha) { $('login-erro').textContent = 'Preencha e-mail e senha.'; return; }
  try {
    await signInWithEmailAndPassword(auth, email, senha);
  } catch (err) {
    $('login-erro').textContent = 'E-mail ou senha incorretos.';
  }
});
$('login-senha').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btn-login').click(); });
$('btn-sair').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  // A checagem real de permissão acontece nas regras do Firestore
  // (só o ADMIN_UID consegue listar a coleção "negocios" por completo).
  // Esta checagem aqui só melhora a mensagem exibida na tela.
  if (user && user.uid === ADMIN_UID) {
    $('tela-login').style.display = 'none';
    $('painel').style.display = 'block';
    escutarNegocios();
  } else if (user) {
    $('login-erro').textContent = 'Essa conta não tem acesso ao painel admin.';
    signOut(auth);
  } else {
    $('tela-login').style.display = 'flex';
    $('painel').style.display = 'none';
  }
});

function escutarNegocios() {
  onSnapshot(collection(db, 'negocios'), (snap) => {
    const negocios = [];
    snap.forEach((d) => negocios.push({ id: d.id, ...d.data() }));
    renderNegocios(negocios);
  });
}

function statusReal(n) {
  if (n.status === 'ativo') return 'ativo';
  if (n.status === 'expirado') return 'expirado';
  if (n.status === 'trial') {
    const trialFim = n.trialFim?.toDate ? n.trialFim.toDate() : new Date(n.trialFim);
    return trialFim >= new Date() ? 'trial' : 'expirado';
  }
  return 'trial';
}

function renderNegocios(negocios) {
  const ativos = negocios.filter((n) => statusReal(n) === 'ativo').length;
  const trial = negocios.filter((n) => statusReal(n) === 'trial').length;
  const expirados = negocios.filter((n) => statusReal(n) === 'expirado').length;
  const vencendo = negocios.filter((n) => {
    if (statusReal(n) !== 'trial') return false;
    const trialFim = n.trialFim?.toDate ? n.trialFim.toDate() : new Date(n.trialFim);
    const dias = (trialFim - new Date()) / (1000 * 60 * 60 * 24);
    return dias <= 3;
  }).length;

  $('k-ativos').textContent = ativos;
  $('k-trial').textContent = trial;
  $('k-vencendo').textContent = vencendo;
  $('k-expirados').textContent = expirados;

  const lista = $('lista-negocios');
  if (negocios.length === 0) {
    lista.innerHTML = '<div class="empty-state">Nenhum negócio cadastrado ainda.</div>';
    return;
  }

  lista.innerHTML = negocios.map((n) => {
    const status = statusReal(n);
    const trialFim = n.trialFim?.toDate ? n.trialFim.toDate() : (n.trialFim ? new Date(n.trialFim) : null);
    const diasRestantes = trialFim ? Math.ceil((trialFim - new Date()) / (1000 * 60 * 60 * 24)) : null;
    return `
      <div class="negocio-card">
        <div class="negocio-topo">
          <div>
            <div class="negocio-nome">${n.nome || '(sem nome)'}</div>
            ${status === 'trial' && diasRestantes != null ? `<div class="negocio-detalhe">Trial: ${diasRestantes >= 0 ? diasRestantes + ' dias restantes' : 'vencido'}</div>` : ''}
          </div>
          <span class="badge ${status}">${status === 'trial' ? '⏳ Trial' : status === 'ativo' ? '✓ Ativo' : '✕ Expirado'}</span>
        </div>
        <div class="negocio-acoes">
          <button class="btn-ativar" data-acao="ativar" data-id="${n.id}">✓ Ativar</button>
          <button class="btn-estender" data-acao="estender" data-id="${n.id}">+7 dias trial</button>
          <button class="btn-expirar" data-acao="expirar" data-id="${n.id}">✕ Expirar</button>
        </div>
      </div>
    `;
  }).join('');

  lista.querySelectorAll('button[data-acao]').forEach((btn) => {
    btn.addEventListener('click', () => executarAcao(btn.dataset.id, btn.dataset.acao));
  });
}

async function executarAcao(id, acao) {
  if (acao === 'ativar') {
    await updateDoc(doc(db, 'negocios', id), { status: 'ativo' });
    toast('Negócio ativado.', 'sucesso');
  } else if (acao === 'expirar') {
    if (!(await confirmar('Expirar o acesso desse negócio agora?'))) return;
    await updateDoc(doc(db, 'negocios', id), { status: 'expirado' });
    toast('Acesso expirado.', 'sucesso');
  } else if (acao === 'estender') {
    const novaData = new Date(); novaData.setDate(novaData.getDate() + 7);
    await updateDoc(doc(db, 'negocios', id), { status: 'trial', trialFim: novaData.toISOString() });
    toast('Trial estendido por 7 dias.', 'sucesso');
  }
}
</script>
</body>
</html>
