<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtus — Criar Conta de Avaliador</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1117;
    --surface:   #1e2229;
    --border:    #2d3340;
    --gold:      #e8a000;
    --gold-dim:  #b07800;
    --text:      #c0cbd6;
    --text-dim:  #7f8c8d;
    --red:       #e74c3c;
    --green:     #2ecc71;
    --radius:    12px;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(232,160,0,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,160,0,.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 48px 44px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 60%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    border-radius: 0 0 4px 4px;
  }

  .logo-wrap { text-align: center; margin-bottom: 32px; }

  .logo-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--gold), #c87800);
    border-radius: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-bottom: 14px;
    box-shadow: 0 8px 24px rgba(232,160,0,.25);
  }

  h1 { font-size: 1.5rem; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
  .subtitle { font-size: 0.82rem; color: var(--text-dim); margin-top: 4px; }
  .field { margin-bottom: 18px; }
  label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-dim); margin-bottom: 6px; letter-spacing: .3px; }

  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 0.95rem;
    color: var(--text);
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232,160,0,.12); }

  .pass-wrap { position: relative; }
  .pass-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    cursor: pointer; background: none; border: none; color: var(--text-dim);
    font-size: 1rem; padding: 4px; transition: color .2s;
  }
  .pass-toggle:hover { color: var(--gold); }

  .btn-login {
    width: 100%; padding: 12px; background: var(--gold); color: #0f1117;
    font-weight: 700; font-size: 0.95rem; border: none; border-radius: 8px;
    cursor: pointer; font-family: inherit; transition: background .2s, transform .1s;
    margin-top: 8px; letter-spacing: .3px;
  }
  .btn-login:hover  { background: #ffb800; }
  .btn-login:active { transform: scale(.98); }
  .btn-login:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .alert {
    padding: 10px 14px; border-radius: 8px; font-size: 0.84rem;
    margin-bottom: 18px; display: none;
  }
  .alert.error   { background: rgba(231,76,60,.15); border: 1px solid rgba(231,76,60,.3); color: #ff8a80; }
  .alert.success { background: rgba(46,204,113,.12); border: 1px solid rgba(46,204,113,.3); color: #69f0ae; }
  .alert.show    { display: block; }

  .hint { font-size: 0.72rem; color: var(--text-dim); margin-top: 6px; }

  .footer-note { text-align: center; margin-top: 24px; font-size: 0.75rem; color: var(--text-dim); }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(15,17,23,.3); border-top-color: #0f1117;
    border-radius: 50%; animation: spin .6s linear infinite;
    vertical-align: middle; margin-right: 6px; display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .nav-links { display:flex; justify-content:center; gap:16px; margin-top:14px; }
  .nav-links a { color: var(--gold-dim); font-size: 0.78rem; text-decoration: none; }
  .nav-links a:hover { color: var(--gold); text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <div class="logo-icon">⚙</div>
    <h1>Criar conta</h1>
    <p class="subtitle">Sistema Virtus · Acesso de avaliador</p>
  </div>

  <div class="alert error" id="alertErr"></div>
  <div class="alert success" id="alertOk"></div>

  <form id="formCadastro">
    <div class="field">
      <label for="inp_nome">Nome completo</label>
      <input type="text" id="inp_nome" placeholder="seu nome" autocomplete="name" required>
    </div>

    <div class="field">
      <label for="inp_email">E-mail</label>
      <input type="email" id="inp_email" placeholder="seu@email.com" autocomplete="email" required>
    </div>

    <div class="field">
      <label for="inp_pass">Senha</label>
      <div class="pass-wrap">
        <input type="password" id="inp_pass" placeholder="mínimo 6 caracteres" autocomplete="new-password" minlength="6" required>
        <button class="pass-toggle" id="btn_show" type="button" title="Mostrar/ocultar senha">👁</button>
      </div>
    </div>

    <div class="field">
      <label for="inp_pass2">Confirmar senha</label>
      <input type="password" id="inp_pass2" placeholder="repita a senha" autocomplete="new-password" minlength="6" required>
      <p class="hint">Depois de criar a conta, um administrador precisa aprovar seu acesso antes que você consiga entrar no dashboard.</p>
    </div>

    <button class="btn-login" id="btn_cadastrar" type="submit">
      <span class="spinner" id="spinner"></span>
      Criar conta
    </button>
  </form>

  <div class="nav-links">
    <a href="./index.html">← Já tenho conta, fazer login</a>
  </div>

  <p class="footer-note">Sistema Virtus · Uso interno · Confidencial</p>
</div>

<script type="module">
  import { virtusCadastrar } from "./js/auth.js";

  const $ = id => document.getElementById(id);

  $('btn_show').onclick = () => {
    const p1 = $('inp_pass'), p2 = $('inp_pass2');
    const show = p1.type === 'password';
    p1.type = show ? 'text' : 'password';
    p2.type = show ? 'text' : 'password';
  };

  $('formCadastro').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nome  = $('inp_nome').value.trim();
    const email = $('inp_email').value.trim();
    const senha = $('inp_pass').value;
    const senha2 = $('inp_pass2').value;
    const errEl = $('alertErr');
    const okEl  = $('alertOk');
    const btn   = $('btn_cadastrar');
    const spin  = $('spinner');

    errEl.className = 'alert'; errEl.textContent = '';
    okEl.className = 'alert'; okEl.textContent = '';

    if (!nome || !email || !senha) {
      errEl.textContent = 'Preencha todos os campos.';
      errEl.className = 'alert error show';
      return;
    }
    if (senha.length < 6) {
      errEl.textContent = 'A senha precisa ter no mínimo 6 caracteres.';
      errEl.className = 'alert error show';
      return;
    }
    if (senha !== senha2) {
      errEl.textContent = 'As senhas não conferem.';
      errEl.className = 'alert error show';
      return;
    }

    btn.disabled = true;
    spin.style.display = 'inline-block';

    try {
      await virtusCadastrar(nome, email, senha);
      okEl.textContent = '✅ Conta criada! Aguarde um administrador aprovar seu acesso.';
      okEl.className = 'alert success show';
      $('formCadastro').reset();
      setTimeout(() => window.location.replace('./index.html?pendente=1'), 1800);
    } catch (err) {
      console.error(err);
      let msg = 'Não foi possível criar a conta.';
      if (err.code === 'auth/email-already-in-use') msg = 'Esse e-mail já está cadastrado.';
      else if (err.code === 'auth/invalid-email') msg = 'E-mail inválido.';
      else if (err.code === 'auth/weak-password') msg = 'Senha muito fraca (mínimo 6 caracteres).';
      errEl.textContent = msg;
      errEl.className = 'alert error show';
    } finally {
      btn.disabled = false;
      spin.style.display = 'none';
    }
  });
</script>
</body>
</html>
