<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Treinamento Operacional Cyano</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #122845; overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  #apresentacao { position: relative; width: 100vw; height: 100vh; }

  .slide {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; z-index: 0;
    transform: scale(1.06) translateX(0);
    transition: opacity .6s cubic-bezier(.22,.61,.36,1), transform .6s cubic-bezier(.22,.61,.36,1);
    background: radial-gradient(ellipse at top left, #1c3a5e 0%, #122845 60%);
    overflow: hidden;
  }
  .slide.ativo { opacity: 1; visibility: visible; z-index: 2; transform: scale(1) translateX(0); }
  .slide.saindo-esquerda { transform: scale(.94) translateX(-4%); opacity: 0; }
  .slide.saindo-direita  { transform: scale(.94) translateX(4%); opacity: 0; }

  /* textura decorativa: diagonais douradas + faixas suaves + pontilhado, tipo corporativo */
  .slide::before, .slide::after { content: ''; position: absolute; z-index: 0; pointer-events: none; }
  .slide::before {
    inset: 0;
    background-image:
      repeating-linear-gradient(-40deg, rgba(230,177,67,.14) 0px, rgba(230,177,67,.14) 1.5px, transparent 1.5px, transparent 46px),
      linear-gradient(-40deg, transparent 55%, rgba(230,177,67,.05) 60%, transparent 66%),
      linear-gradient(-40deg, transparent 70%, rgba(230,177,67,.045) 74%, transparent 80%);
  }
  .slide::after {
    top: 0; right: 0; width: 46%; height: 60%;
    background-image: radial-gradient(rgba(230,177,67,.4) 1.6px, transparent 1.6px);
    background-size: 22px 22px;
    -webkit-mask-image: linear-gradient(-40deg, transparent 40%, #000 78%, transparent 100%);
            mask-image: linear-gradient(-40deg, transparent 40%, #000 78%, transparent 100%);
    opacity: .5;
  }
  .conteudo, .slide-imagem-caixa, .rodape-marca { position: relative; z-index: 1; }

  /* ---- padrão comum a todo slide de conteúdo ---- */
  .conteudo {
    width: min(1100px, 92vw); max-height: 88vh;
    display: flex; flex-direction: column; gap: 1.4rem;
  }
  .rotulo {
    display: inline-flex; align-items: center; gap: .5rem;
    font-size: .72rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: #e6b143; width: fit-content;
  }
  .rotulo::before { content: ''; width: 22px; height: 2px; background: #e6b143; display: inline-block; }
  .titulo {
    font-size: clamp(1.5rem, 4vw, 2.6rem); font-weight: 800; color: #f6f8fb;
    line-height: 1.18; letter-spacing: -.01em; margin: 0;
  }
  .subtitulo {
    font-size: clamp(.95rem, 1.6vw, 1.15rem); color: #b8c3d4; font-weight: 400;
    line-height: 1.55; margin: 0; max-width: 62ch;
  }
  .linha-divisora {
    height: 1px; width: 100%;
    background: linear-gradient(90deg, rgba(230,177,67,.6), rgba(230,177,67,0));
  }

  .lista-topicos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .85rem; }
  .lista-topicos li {
    display: flex; align-items: flex-start; gap: .8rem;
    font-size: clamp(.92rem, 1.5vw, 1.08rem); color: #dbe4f0; line-height: 1.5;
  }
  .lista-topicos li::before {
    content: ''; flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%;
    background: #e6b143; margin-top: .55em; box-shadow: 0 0 8px rgba(230,177,67,.6);
  }

  .grade-equipe {
    display: grid; grid-template-columns: repeat(auto-fit, 180px);
    justify-content: center; gap: 1.6rem 2.2rem;
  }
  .grade-equipe-3col { grid-template-columns: repeat(3, 180px); }
  .pessoa { display: flex; flex-direction: column; align-items: center; text-align: center; gap: .7rem; }
  .foto-pessoa {
    position: relative; width: 148px; height: 148px; border-radius: 50%; overflow: hidden;
    background: linear-gradient(135deg, #2a4a70, #1c3a5e);
    border: 3px solid rgba(230,177,67,.55);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
  }
  .foto-pessoa img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .foto-pessoa .iniciais { font-size: 2rem; font-weight: 800; color: #e6b143; letter-spacing: .02em; }
  .pessoa .nome-pessoa { font-size: .98rem; font-weight: 700; color: #f6f8fb; line-height: 1.3; }
  .pessoa .cargo-pessoa { font-size: .78rem; color: #e6b143; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }

  .grade-cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
  .cartao {
    background: rgba(255,255,255,.05); border: 1px solid rgba(230,177,67,.3); border-radius: 14px;
    padding: 1.3rem 1.4rem; box-shadow: 0 2px 14px rgba(0,0,0,.15); backdrop-filter: blur(6px);
  }
  .cartao .rotulo-cartao {
    font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    color: #e6b143; margin: 0 0 .5rem;
  }
  .cartao p { margin: 0; font-size: .92rem; color: #cdd6e4; line-height: 1.5; }

  /* animações da capa: vento + ondas */
  .vento-capa { position: absolute; inset: 0; z-index: 2; overflow: hidden; pointer-events: none; }
  .vento-capa span.risco {
    position: absolute; height: 2px; width: 26vw;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent);
    left: -30vw; opacity: 0; border-radius: 2px;
    animation: ventoPassa 6s linear infinite;
  }
  .vento-capa span.risco:nth-of-type(1) { top: 14%; animation-delay: 0s; width: 24vw; }
  .vento-capa span.risco:nth-of-type(2) { top: 28%; animation-delay: 1.2s; width: 32vw; }
  .vento-capa span.risco:nth-of-type(3) { top: 44%; animation-delay: 2.3s; width: 20vw; }
  .vento-capa span.risco:nth-of-type(4) { top: 58%; animation-delay: 3.4s; width: 28vw; }
  .vento-capa span.risco:nth-of-type(5) { top: 71%; animation-delay: 4.4s; width: 22vw; }
  .vento-capa span.risco:nth-of-type(6) { top: 22%; animation-delay: 5s; width: 18vw; }
  .vento-capa span.risco:nth-of-type(7) { top: 84%; animation-delay: 2.8s; width: 24vw; }
  @keyframes ventoPassa {
    0%   { transform: translateX(0); opacity: 0; }
    8%   { opacity: .8; }
    45%  { opacity: .45; }
    100% { transform: translateX(150vw); opacity: 0; }
  }

  .vento-capa span.floco {
    position: absolute; width: 1.5px; height: 1.5px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 3px 1px rgba(255,255,255,.6);
    left: -3vw; opacity: 0;
    animation: flocoVoa linear infinite;
  }
  @keyframes flocoVoa {
    0%   { transform: translate(0, 0); opacity: 0; }
    10%  { opacity: .8; }
    50%  { transform: translate(70vw, -3vh); opacity: .6; }
    90%  { opacity: .25; }
    100% { transform: translate(150vw, 4vh); opacity: 0; }
  }

  .ondas-slide {
    position: absolute; left: 0; right: 0; bottom: 0; height: 14vh; min-height: 90px; z-index: 0;
    overflow: hidden; pointer-events: none;
  }
  .ondas-slide svg { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; }
  .onda { fill: rgba(255,255,255,.16); }
  .onda-2 { fill: rgba(255,255,255,.28); }
  .onda-1 { animation: ondaMove 9s ease-in-out infinite; }
  .onda-2 { animation: ondaMove 6.5s ease-in-out infinite reverse; }
  @keyframes ondaMove {
    0%, 100% { transform: translateX(0) translateY(0); }
    50% { transform: translateX(-4%) translateY(4px); }
  }

  /* slide de capa/seção */
  .slide-capa .conteudo { align-items: flex-start; }
  .slide-capa .titulo { font-size: clamp(1.9rem, 5.5vw, 3.4rem); }
  .numero-grande {
    font-size: clamp(3.5rem, 9vw, 6.5rem); font-weight: 900; color: transparent;
    -webkit-text-stroke: 1.5px rgba(230,177,67,.4); line-height: 1; letter-spacing: -.02em;
  }

  /* slide de encerramento */
  .slide-final .conteudo { align-items: center; text-align: center; }
  .slide-final .titulo { font-size: clamp(1.7rem, 4.5vw, 2.8rem); }
  .marca-final {
    font-size: .85rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
    color: #e6b143; margin-top: .6rem;
  }

  .rodape-marca {
    position: absolute; bottom: 22px; left: 32px; z-index: 1;
    font-size: .68rem; letter-spacing: .12em; text-transform: uppercase;
    color: rgba(255,255,255,.3); font-weight: 700; pointer-events: none;
  }

  /* slide-imagem (organogramas originais do PDF) */
  .slide-imagem-caixa {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 90px 3vw 40px;
  }
  .slide-imagem-caixa img {
    max-width: 100%; max-height: 100%; width: auto; height: auto;
    object-fit: contain; border-radius: 6px;
    box-shadow: 0 16px 50px rgba(0,0,0,.35);
    border: 1px solid rgba(230,177,67,.35);
  }

  @keyframes entrarSuave {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes entrarFade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .slide.ativo .conteudo { animation: entrarSuave .6s ease both; }
  .slide.ativo .slide-imagem-caixa img { animation: entrarFade .5s ease both; }
  .slide.ativo .lista-topicos li { animation: entrarSuave .5s ease both; }
  .slide.ativo .lista-topicos li:nth-child(1) { animation-delay: .05s; }
  .slide.ativo .lista-topicos li:nth-child(2) { animation-delay: .11s; }
  .slide.ativo .lista-topicos li:nth-child(3) { animation-delay: .17s; }
  .slide.ativo .lista-topicos li:nth-child(4) { animation-delay: .23s; }
  .slide.ativo .lista-topicos li:nth-child(5) { animation-delay: .29s; }
  .slide.ativo .lista-topicos li:nth-child(6) { animation-delay: .35s; }
  .slide.ativo .lista-topicos li:nth-child(7) { animation-delay: .41s; }
  .slide.ativo .lista-topicos li:nth-child(8) { animation-delay: .47s; }

  /* zonas de clique/toque para navegar */
  .zona-clique { position: fixed; top: 0; bottom: 0; width: 45%; z-index: 5; }
  #zona-voltar { left: 0; cursor: pointer; }
  #zona-avancar { right: 0; cursor: pointer; }

  #progresso-wrap { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 20; background: rgba(255,255,255,.1); }
  #progresso { height: 100%; width: 0%; background: linear-gradient(90deg, #c9971f, #e6b143); transition: width .35s ease; }

  #controles {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center; gap: 1.2rem;
    padding: .9rem 1rem 1.1rem;
    background: linear-gradient(to top, rgba(10,22,38,.85), transparent);
  }
  .btn-ctrl {
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,.07); border: 1px solid rgba(230,177,67,.4);
    color: #e6b143; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1.1rem; backdrop-filter: blur(6px);
    transition: background .2s ease, transform .15s ease;
  }
  .btn-ctrl:hover { background: rgba(230,177,67,.18); transform: scale(1.06); }
  .btn-ctrl:active { transform: scale(.95); }
  #contador { color: #cdd6e4; font-size: .82rem; letter-spacing: .04em; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }

  #tela-inicio {
    position: fixed; inset: 0; z-index: 50; color: #f6f8fb; overflow: hidden;
    background: linear-gradient(rgba(10,20,35,.35), rgba(10,20,35,.55)), url('img/capa/tela-inicio.jpg') center/cover no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: 83vh; gap: 1rem; cursor: pointer;
  }
  #tela-inicio h1 {
    font-size: 1.15rem; font-weight: 700; letter-spacing: .03em; text-align: center; padding: 0 1.5rem;
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
  }

  /* efeito cibernético: varredura de scanner + grade + pulsos de radar no botão */
  #tela-inicio .scanner {
    position: absolute; left: 0; right: 0; height: 2px; z-index: 1; pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(120,220,255,.9), rgba(230,177,67,.9), transparent);
    box-shadow: 0 0 12px 2px rgba(120,220,255,.6);
    animation: scannerVarre 4.5s linear infinite;
  }
  @keyframes scannerVarre {
    0%   { top: -2%; opacity: 0; }
    6%   { opacity: 1; }
    94%  { opacity: 1; }
    100% { top: 102%; opacity: 0; }
  }
  #tela-inicio .grade-ciber {
    position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: .35;
    background-image:
      linear-gradient(rgba(120,220,255,.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,220,255,.12) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 0%, transparent 72%);
            mask-image: radial-gradient(ellipse at center, #000 0%, transparent 72%);
  }

  #tela-inicio .icone-play {
    position: relative; width: 76px; height: 76px; border-radius: 50%; z-index: 2;
    background: linear-gradient(135deg, #c9971f, #e6b143);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 30px rgba(230,177,67,.35);
  }
  #tela-inicio .icone-play::before, #tela-inicio .icone-play::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    border: 1.5px solid rgba(120,220,255,.7);
    animation: radarPulso 2.4s ease-out infinite;
  }
  #tela-inicio .icone-play::after { animation-delay: 1.2s; }
  @keyframes radarPulso {
    0%   { transform: scale(1); opacity: .8; }
    100% { transform: scale(2.1); opacity: 0; }
  }
  #tela-inicio .icone-play svg { width: 28px; height: 28px; fill: #122845; margin-left: 4px; position: relative; z-index: 1; }
  #tela-inicio p { font-size: .8rem; color: rgba(255,255,255,.45); position: relative; z-index: 2; }

  /* rolagem de segurança: em telas pequenas ou conteúdo longo, permite rolar dentro do slide */
  .conteudo {
    max-height: 82vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding-right: 4px;
  }
  .conteudo::-webkit-scrollbar { width: 5px; }
  .conteudo::-webkit-scrollbar-thumb { background: rgba(230,177,67,.35); border-radius: 3px; }

  @media (max-width: 640px) {
    .btn-ctrl { width: 38px; height: 38px; font-size: 1rem; }
    #controles { gap: .8rem; }
    .conteudo { gap: 1rem; max-height: 76vh; }
    .rodape-marca { left: 18px; bottom: 60px; }

    .grade-equipe { grid-template-columns: repeat(2, 1fr); gap: .9rem 1rem; }
    .foto-pessoa { width: 84px; height: 84px; border-width: 2px; }
    .foto-pessoa .iniciais { font-size: 1.15rem; }
    .pessoa { gap: .4rem; }
    .pessoa .nome-pessoa { font-size: .78rem; }
    .pessoa .cargo-pessoa { font-size: .64rem; }

    .titulo { font-size: clamp(1.25rem, 6vw, 1.7rem); }
    .subtitulo { font-size: .88rem; }
    .lista-topicos li { font-size: .85rem; }

    .slide-imagem-caixa { padding: 60px 4vw 60px; }
    .rotulo { font-size: .62rem; }
  }

  @media (max-width: 640px) and (orientation: portrait) {
    .slide-imagem-caixa img { max-height: 55vh; }
  }
</style>
</head>
<body>

<div id="tela-inicio">
  <div class="grade-ciber"></div>
  <div class="scanner"></div>
  <div class="icone-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
  <p>Toque para iniciar a apresentação</p>
</div>

<div id="progresso-wrap"><div id="progresso"></div></div>

<div id="apresentacao"></div>

<div id="zona-voltar" class="zona-clique"></div>
<div id="zona-avancar" class="zona-clique"></div>

<div id="controles">
  <div class="btn-ctrl" id="btn-voltar" title="Slide anterior">‹</div>
  <div id="contador">1 / 1</div>
  <div class="btn-ctrl" id="btn-avancar" title="Próximo slide">›</div>
  <div class="btn-ctrl" id="btn-tela-cheia" title="Tela cheia">⛶</div>
</div>

<script>

  const pastaImagens = 'img/slides/';

  function criarSlide(dados) {
    const div = document.createElement('div');
    div.className = 'slide slide-' + dados.tipo;

    if (dados.tipo === 'imagem') {
      const wrap = document.createElement('div');
      wrap.className = 'slide-imagem-caixa';
      const rot = document.createElement('div');
      rot.className = 'rotulo'; rot.style.position = 'absolute'; rot.style.top = '32px'; rot.style.left = '40px';
      rot.textContent = dados.rotulo;
      div.appendChild(rot);
      const img = document.createElement('img');
      img.src = pastaImagens + dados.src;
      img.alt = dados.titulo;
      img.loading = 'lazy';
      wrap.appendChild(img);
      div.appendChild(wrap);
    } else if (dados.tipo === 'capaFoto') {
      const img = document.createElement('img');
      img.src = 'img/' + dados.src;
      img.alt = 'Capa da apresentação';
      img.style.width = '100%'; img.style.height = '100%'; img.style.objectFit = 'cover';
      div.appendChild(img);

      const vento = document.createElement('div');
      vento.className = 'vento-capa';
      let ventoHtml = '<span class="risco"></span>'.repeat(7);
      for (let i = 0; i < 22; i++) {
        const topo = Math.random() * 92;
        const atraso = (Math.random() * 6).toFixed(2);
        const duracao = (14 + Math.random() * 10).toFixed(2);
        ventoHtml += `<span class="floco" style="top:${topo}%; animation-delay:${atraso}s; animation-duration:${duracao}s;"></span>`;
      }
      vento.innerHTML = ventoHtml;
      div.appendChild(vento);
    } else if (dados.tipo === 'capa') {
      const c = document.createElement('div');
      c.className = 'conteudo';
      c.innerHTML = `
        <span class="rotulo">${dados.rotulo}</span>
        <h1 class="titulo">${dados.titulo}</h1>
        ${dados.sub ? `<p class="subtitulo">${dados.sub}</p>` : ''}
        <div class="linha-divisora"></div>
      `;
      div.appendChild(c);
    } else if (dados.tipo === 'topicos') {
      const c = document.createElement('div');
      c.className = 'conteudo';
      const lis = dados.itens.map(t => `<li>${t}</li>`).join('');
      c.innerHTML = `
        <span class="rotulo">${dados.rotulo}</span>
        <h1 class="titulo">${dados.titulo}</h1>
        <div class="linha-divisora"></div>
        <ul class="lista-topicos">${lis}</ul>
      `;
      div.appendChild(c);
    } else if (dados.tipo === 'equipe') {
      const c = document.createElement('div');
      c.className = 'conteudo';
      const iniciaisDe = (nome) => nome.split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
      const cards = dados.pessoas.map(p => `
        <div class="pessoa">
          <div class="foto-pessoa">
            <span class="iniciais">${iniciaisDe(p.nome)}</span>
            <img src="img/equipe/${p.foto}" alt="${p.nome}" onerror="this.style.display='none'">
          </div>
          <span class="nome-pessoa">${p.nome}</span>
          <span class="cargo-pessoa">${p.cargo}</span>
        </div>
      `).join('');
      const classeGrade = dados.pessoas.length > 4 ? 'grade-equipe grade-equipe-3col' : 'grade-equipe';
      c.innerHTML = `
        <span class="rotulo">${dados.rotulo}</span>
        <h1 class="titulo">${dados.titulo}</h1>
        <div class="linha-divisora"></div>
        <div class="${classeGrade}">${cards}</div>
      `;
      div.appendChild(c);
    } else if (dados.tipo === 'cartoes') {
      const c = document.createElement('div');
      c.className = 'conteudo';
      const cards = dados.cartoes.map(x => `<div class="cartao"><p class="rotulo-cartao">${x.r}</p><p>${x.t}</p></div>`).join('');
      c.innerHTML = `
        <span class="rotulo">${dados.rotulo}</span>
        <h1 class="titulo">${dados.titulo}</h1>
        <div class="linha-divisora"></div>
        <div class="grade-cartoes">${cards}</div>
      `;
      div.appendChild(c);
    } else if (dados.tipo === 'final') {
      const c = document.createElement('div');
      c.className = 'conteudo';
      c.innerHTML = `
        <h1 class="titulo">${dados.titulo}</h1>
        <p class="subtitulo">${dados.sub}</p>
        <div class="linha-divisora" style="width:120px"></div>
        <span class="marca-final">${dados.marca}</span>
      `;
      div.appendChild(c);
    }

    const ondas = document.createElement('div');
    ondas.className = 'ondas-slide';
    ondas.innerHTML = `
      <svg viewBox="0 0 1600 160" preserveAspectRatio="none">
        <path class="onda onda-1" d="M0,90 C 200,40 400,140 600,90 C 800,40 1000,140 1200,90 C 1350,60 1500,110 1600,90 L1600,160 L0,160 Z"></path>
        <path class="onda onda-2" d="M0,110 C 220,70 420,150 620,110 C 820,70 1020,150 1220,110 C 1370,85 1500,125 1600,110 L1600,160 L0,160 Z"></path>
      </svg>
    `;
    div.appendChild(ondas);

    return div;
  }

  const apresentacao = document.getElementById('apresentacao');
  const contador = document.getElementById('contador');
  const progresso = document.getElementById('progresso');
  let atual = 0;
  let slides = [];

  slidesDados.forEach((dados, i) => {
    const el = criarSlide(dados);
    if (i === 0) el.classList.add('ativo');
    apresentacao.appendChild(el);
    slides.push(el);
  });
  const totalSlides = slides.length;

  function atualizarUI() {
    contador.textContent = (atual + 1) + ' / ' + totalSlides;
    progresso.style.width = ((atual + 1) / totalSlides * 100) + '%';
  }

  function mostrar(indice) {
    if (indice < 0 || indice >= totalSlides || indice === atual) return;
    const indoPraFrente = indice > atual;
    const anterior = slides[atual];

    anterior.classList.add(indoPraFrente ? 'saindo-esquerda' : 'saindo-direita');
    anterior.classList.remove('ativo');

    atual = indice;
    slides[atual].classList.remove('saindo-esquerda', 'saindo-direita');
    slides[atual].classList.add('ativo');

    setTimeout(() => anterior.classList.remove('saindo-esquerda', 'saindo-direita'), 650);

    atualizarUI();
  }

  function avancar() { mostrar(atual + 1); }
  function voltar() { mostrar(atual - 1); }

  // Passador de slides (clicker) normalmente envia setas, PageUp/PageDown, Espaço ou "b"
  document.addEventListener('keydown', (e) => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) {
      e.preventDefault();
      avancar();
    } else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) {
      e.preventDefault();
      voltar();
    } else if (e.key === 'f' || e.key === 'F') {
      alternarTelaCheia();
    }
  });

  document.getElementById('zona-avancar').addEventListener('click', avancar);
  document.getElementById('zona-voltar').addEventListener('click', voltar);
  document.getElementById('btn-avancar').addEventListener('click', (e) => { e.stopPropagation(); avancar(); });
  document.getElementById('btn-voltar').addEventListener('click', (e) => { e.stopPropagation(); voltar(); });

  // Toque/arrastar no celular e tablet
  let toqueX = 0;
  document.addEventListener('touchstart', (e) => { toqueX = e.changedTouches[0].screenX; }, { passive: true });
  document.addEventListener('touchend', (e) => {
    const diff = e.changedTouches[0].screenX - toqueX;
    if (Math.abs(diff) < 40) return;
    diff < 0 ? avancar() : voltar();
  }, { passive: true });

  function alternarTelaCheia() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.();
    }
  }
  document.getElementById('btn-tela-cheia').addEventListener('click', (e) => {
    e.stopPropagation();
    alternarTelaCheia();
  });

  document.getElementById('tela-inicio').addEventListener('click', function () {
    this.style.display = 'none';
    alternarTelaCheia();
  });

  atualizarUI();
</script>
