<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Apresentação</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden; font-family: system-ui, sans-serif;
  }

  #apresentacao {
    position: relative; width: 100vw; height: 100vh;
  }

  .slide {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transition: opacity .5s ease;
  }
  .slide.ativo { opacity: 1; visibility: visible; }

  .slide img {
    max-width: 100%; max-height: 100%; width: 100%; height: 100%;
    object-fit: contain; /* troque para "cover" se quiser preencher a tela sem sobras */
    background: #000;
  }

  /* área invisível para clique/toque avançar (lado direito) e voltar (lado esquerdo) */
  .zona-clique {
    position: fixed; top: 0; bottom: 0; width: 50%; z-index: 5;
  }
  #zona-voltar { left: 0; cursor: pointer; }
  #zona-avancar { right: 0; cursor: pointer; }

  #contador {
    position: fixed; bottom: 14px; right: 18px; z-index: 10;
    color: rgba(255,255,255,.55); font-size: .8rem; letter-spacing: .05em;
    background: rgba(0,0,0,.35); padding: .25rem .6rem; border-radius: 20px;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>

<div id="apresentacao">
  <!-- Adicione/edite quantos slides quiser. Troque o "src" pela sua imagem. -->
  <div class="slide ativo"><img src="https://via.placeholder.com/1600x900/1a1a1a/ffffff?text=Slide+1" alt="Slide 1"></div>
  <div class="slide"><img src="https://via.placeholder.com/1600x900/2a2a2a/ffffff?text=Slide+2" alt="Slide 2"></div>
  <div class="slide"><img src="https://via.placeholder.com/1600x900/3a3a3a/ffffff?text=Slide+3" alt="Slide 3"></div>
</div>

<div id="zona-voltar" class="zona-clique"></div>
<div id="zona-avancar" class="zona-clique"></div>
<div id="contador"></div>

<script>
  const slides = document.querySelectorAll('.slide');
  const contador = document.getElementById('contador');
  let atual = 0;

  function mostrar(indice) {
    if (indice < 0 || indice >= slides.length) return;
    slides[atual].classList.remove('ativo');
    atual = indice;
    slides[atual].classList.add('ativo');
    contador.textContent = (atual + 1) + ' / ' + slides.length;
  }

  function avancar() { mostrar(atual + 1); }
  function voltar() { mostrar(atual - 1); }

  // Passador de slides (clicker) normalmente envia setas, PageUp/PageDown, Espaço ou "b"
  document.addEventListener('keydown', (e) => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) {
      e.preventDefault();
      avancar();
    } else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) {
      e.preventDefault();
      voltar();
    }
  });

  document.getElementById('zona-avancar').addEventListener('click', avancar);
  document.getElementById('zona-voltar').addEventListener('click', voltar);

  // Toque/arrastar no celular e tablet
  let toqueX = 0;
  document.addEventListener('touchstart', (e) => { toqueX = e.changedTouches[0].screenX; }, { passive: true });
  document.addEventListener('touchend', (e) => {
    const diff = e.changedTouches[0].screenX - toqueX;
    if (Math.abs(diff) < 40) return;
    diff < 0 ? avancar() : voltar();
  }, { passive: true });

  mostrar(0);
</script>

</body>
</html>
